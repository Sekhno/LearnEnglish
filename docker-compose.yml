services:
  piper:
    build:
      context: ./piper
    container_name: learnenglish-piper
    volumes:
      - piper_voices:/piper-voices
    ports:
      - "5000:5000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: learnenglish-postgres
    environment:
      POSTGRES_DB: learnenglish
      POSTGRES_USER: learnenglish
      POSTGRES_PASSWORD: learnenglish
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnenglish"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnenglish-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learnenglish
      SPRING_DATASOURCE_USERNAME: learnenglish
      SPRING_DATASOURCE_PASSWORD: learnenglish
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
      AI_LLM_BASE_URL: http://host.docker.internal:1234
      AI_LLM_MODEL: qwen3.5-9b
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnenglish-frontend
    depends_on:
      - backend
      - piper
    ports:
      - "4200:80"

volumes:
  postgres_data:
  piper_voices:
